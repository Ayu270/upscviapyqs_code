<style>
:root{
  --navy:#16223E;--navy2:#1E3358;--gold:#D4A843;--gold-d:#B8922A;
  --cream:#FAF7F0;--bg:#F0E8D6;--card:#FFFFFF;--text:#1E1E2E;--muted:#7A7A8A;

}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold);gap:16px;flex-wrap:wrap}

.nav{display:flex;gap:6px}
.nav a{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);text-decoration:none;padding:6px 12px;border-radius:20px;border:1.5px solid transparent}
.nav a:hover{color:#fff;border-color:rgba(255,255,255,.2)}

.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}

<script>
let DATA=[], view=[], page=0, PER=10;
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(html){ const t=$("q").value.trim(); if(t.length<2)return html;
  const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  return html.split(/(<[^>]+>)/).map(s=>s.charAt(0)==="<"?s:s.replace(re,"<mark>$1</mark>")).join(""); }

/* ---- paper display + ordering ---- */
const PAPER_LABEL={"Paper 1":"Paper 1","Paper 2":"Paper 2"};
const PAPER_ORDER=["Paper 1","Paper 2"];

/* ---- inline markdown ---- */
function inline(t){
  t=esc(t);
  t=t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/\*\*([^*]+?)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,"$1<em>$2</em>");
  t=t.replace(/`([^`]+?)`/g,"<code>$1</code>");
  return t;
}
/* ---- nested list builder ---- */
function renderList(items){
  let out="",i=0;
  while(i<items.length){
    const base=items[i].indent, ordered=items[i].ordered;
    out+=ordered?"<ol>":"<ul>";
    while(i<items.length && items[i].indent===base){
      let li="<li>"+inline(items[i].text);
      let j=i+1; const kids=[];
      while(j<items.length && items[j].indent>base){kids.push(items[j]);j++;}
      if(kids.length) li+=renderList(kids);
      out+=li+"</li>"; i=j;
    }
    out+=ordered?"</ol>":"</ul>";
  }
  return out;
}
/* ---- block markdown ---- */
function mdToHtml(md){
  if(!md) return "";
  const lines=md.replace(/\r\n?/g,"\n").split("\n");
  let html="",i=0,para=[];
  const flush=()=>{ if(para.length){html+="<p>"+inline(para.join(" "))+"</p>";para=[];} };
  const listRe=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const tableSep=/^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)+\|?\s*$/;
  while(i<lines.length){
    const ln=lines[i], t=ln.trim();
    if(!t){ flush(); i++; continue; }
    // horizontal rule
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ flush(); html+="<hr>"; i++; continue; }
    // ATX heading
    let h=t.match(/^(#{1,6})\s+(.*)$/);
    if(h){ flush(); let lv=Math.min(h[1].length+1,4); html+="<h"+lv+">"+inline(h[2].replace(/\s*#+\s*$/,""))+"</h"+lv+">"; i++; continue; }
    // table
    if(t.indexOf("|")>=0 && i+1<lines.length && tableSep.test(lines[i+1])){
      flush();
      const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      const head=cells(t);
      html+="<table><thead><tr>"+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
      i+=2;
      while(i<lines.length && lines[i].indexOf("|")>=0 && lines[i].trim()){
        const r=cells(lines[i]); html+="<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>"; i++;
      }
      html+="</tbody></table>"; continue;
    }
    // blockquote
    if(/^>\s?/.test(t)){ flush(); const buf=[]; while(i<lines.length && /^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,""));i++;} html+="<blockquote>"+inline(buf.join(" "))+"</blockquote>"; continue; }
    // list block
    if(listRe.test(ln)){
      flush(); const items=[];
      while(i<lines.length){
        const m=lines[i].match(listRe);
        if(!m){ break; }
        items.push({indent:m[1].replace(/\t/g,"  ").length, ordered:/\d/.test(m[2]), text:m[3]});
        i++;
      }
      html+=renderList(items); continue;
    }
    // bold-only line → subheading
    let b=t.match(/^\*\*(.+?)\*\*[:：]?\s*$/);
    if(b){ flush(); html+='<div class="mdsub">'+inline(b[1])+"</div>"; i++; continue; }
    // paragraph text — each source line is its own block (Notion-style), so emit one <p> per line
    para.push(t); flush(); i++;
  }
  flush();
  return html;
}
function renderMath(html){
  if(!window.katex||!html||html.indexOf("\\")<0)return html||"";
  return html
    .replace(/\\\[([\s\S]+?)\\\]/g,(m,e)=>{try{return katex.renderToString(e,{displayMode:true,throwOnError:false})}catch(_){return m}})
    .replace(/\\\(([\s\S]+?)\\\)/g,(m,e)=>{try{return katex.renderToString(e,{displayMode:false,throwOnError:false})}catch(_){return m}});
}

/* ---- derive stem + answer from body_md ---- */
function splitBody(x){
  const body=(x.body_md||"").replace(/\r\n?/g,"\n");
  const lines=body.split("\n");
  let first=lines.findIndex(l=>l.trim()!=="");
  if(first<0) return {stem:x.question_md||"(question)", ans:""};
  let stem=lines[first].trim().replace(/^[-*+]\s+/,"").trim();
  const ans=lines.slice(first+1).join("\n").trim();
  return {stem:stem||x.question_md||"(question)", ans};
}
/* case studies: label from question_md, split scenario from model answer at "(Answer in N words)" */
function caseStudy(x){
  const isCase=(x.topics||[]).some(t=>/case study/i.test(t)) || /^\s*case study/i.test(x.question_md||"");
  if(!isCase) return null;
  const body=(x.body_md||"").replace(/\r\n?/g,"\n");
  const mm=body.match(/\(Answer in[^)]*\)/i);
  let q=body, a="";
  if(mm){ const end=body.indexOf(mm[0])+mm[0].length; q=body.slice(0,end); a=body.slice(end); }
  return { title:(x.question_md||"Case Study").trim(), q:q.replace(/^\s*-\s+/,"").trim(), a:a.trim() };
}

fetch("../data/optional.json").then(r=>r.json()).then(optional=>{
  DATA=optional.map(x=>{
    const label=PAPER_LABEL[x.paper]||x.paper||"—";
    const subj=x.optional_subject||"—";
    const sb=splitBody(x);
    const cs=caseStudy(x);
    return {...x, _label:label, _subject:subj, _isCase:!!cs, _title:cs?cs.title:sb.stem, _caseQ:cs?cs.q:null,
            _stem:sb.stem, _ans:cs?cs.a:sb.ans,
            _search:((sb.stem||"")+" "+(x.question_md||"")+" "+(x.topics||[]).join(" ")).toLowerCase()};
  });
  const subjects=[...new Set(DATA.map(x=>x._subject))].filter(s=>s&&s!=="—").sort();
  $("hcount").textContent=DATA.length.toLocaleString()+" questions · "+(subjects.length===1?subjects[0]:subjects.length+" subjects");
  MSel.create("subject",{key:"subject",label:"Subject"});
  MSel.create("paper",{key:"paper",label:"Paper"});
  MSel.create("topic",{key:"topic",label:"Topic"});
  MSel.create("year",{key:"year",label:"Year"});
  MSel.create("wl",{key:"wl",label:"Words"});
  MSel.create("show",{key:"show",label:"Show"});
  MSel.setOptions("show",[{v:"book",l:"★ Bookmarked"},{v:"rev",l:"⚑ For revision"}]);
  MSel.onChange(()=>{page=0;refreshFacets();apply();});
  $("q").addEventListener("input",()=>{page=0;apply()});
  $("sort").addEventListener("input",()=>{page=0;apply()});
  document.addEventListener("keydown",e=>{const tag=(document.activeElement&&document.activeElement.tagName)||"";if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA")return;const pages=Math.ceil(view.length/PER);if(e.key==="ArrowLeft"&&page>0)go(-1);else if(e.key==="ArrowRight"&&page<pages-1)go(1);});
  buildPicker(subjects);
  const P=new URLSearchParams(location.search);
  const fk=["subject","paper","topic","year","wl","show"];
  const hasParams=fk.some(k=>P.get(k))||P.get("q");
  fk.forEach(k=>{const v=P.get(k);if(v)MSel.set(k,v.split(","));});
  if(P.get("q"))$("q").value=P.get("q");
  if(P.get("sort"))$("sort").value=P.get("sort");
  $("subjlabel").textContent=(P.get("subject")||"All subjects").split(",")[0];
  document.body.classList.toggle("pick",!hasParams);   // landing → picker; deep-links → explorer
  refreshFacets(); apply();
}).catch(e=>{console.error("load error:",e);$("list").innerHTML='<div class="loading">Could not load data. Serve from the project root:<br><br><code>cd upscviapyqs &amp;&amp; python3 serve.py</code><br>then open <code>http://localhost:8000/app/optional.html</code></div>';});

function buildPicker(subjects){
  const ICON={"Public Administration":"📚"};
  const cards=subjects.map(s=>{
    const items=DATA.filter(x=>x._subject===s), papers=uniq(items.map(x=>x._label)).length;
    return '<div class="subcard" data-s="'+esc(s)+'" onclick="openSubject(this.dataset.s)">'+
      '<div class="ic">'+(ICON[s]||"📘")+'</div><div class="t">'+esc(s)+'</div>'+
      '<div class="d">'+items.length.toLocaleString()+' questions · '+papers+' paper'+(papers>1?'s':'')+' · 2013–2025</div>'+
      '<div class="go">Open →</div></div>';
  }).join("");
  const soon='<div class="subcard soon"><div class="ic">➕</div><div class="t">More subjects coming soon</div><div class="d">PSIR, Sociology, Geography, Anthropology and more are on the way.</div></div>';
  $("picker").innerHTML='<h2>Choose an optional subject</h2><div class="sub">Pick your optional to browse its Previous Year Questions and model answers.</div><div class="subgrid">'+cards+soon+'</div>';
}
let FWDATA=null;
window.openSubject=s=>{
  ["paper","topic","year","wl","show"].forEach(k=>MSel.set(k,[])); MSel.set("subject",[s]); $("q").value="";
  $("subjlabel").textContent=s; document.body.classList.remove("pick"); document.body.classList.remove("fw");
  document.querySelectorAll("#vtoggle button").forEach(b=>b.classList.toggle("on",b.dataset.v==="q"));
  page=0; refreshFacets(); apply(); window.scrollTo({top:0,behavior:"smooth"});
};
window.toSubjects=()=>{ document.body.classList.add("pick"); window.scrollTo({top:0}); };
window.setView=v=>{
  document.querySelectorAll("#vtoggle button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.body.classList.toggle("fw",v==="f");
  if(v==="f") loadFrameworks();
  window.scrollTo({top:0,behavior:"smooth"});
};
function loadFrameworks(){
  const subj=(MSel.values("subject")[0])||$("subjlabel").textContent;
  const draw=()=>FW.mount($("fwlist"), (FWDATA||[]).filter(n=>(n.path||"").indexOf(subj)>=0));
  if(FWDATA){ draw(); return; }
  $("fwlist").className="loading"; $("fwlist").textContent="Loading frameworks…";
  fetch("../data/frameworks.json").then(r=>r.json()).then(d=>{FWDATA=d;$("fwlist").className="";draw();})
    .catch(()=>{$("fwlist").textContent="Could not load frameworks.";});
}

const uniq=a=>[...new Set(a)];
const paperSort=(a,b)=>{const ia=PAPER_ORDER.indexOf(a),ib=PAPER_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);};
function facetOK(x,exc){
  const Sj=MSel.values("subject"),P=MSel.values("paper"),T=MSel.values("topic"),Y=MSel.values("year"),W=MSel.values("wl");
  if(exc!=="subject"&&Sj.length&&!Sj.includes(x._subject))return false;
  if(exc!=="paper"&&P.length&&!P.includes(x._label))return false;
  if(exc!=="topic"&&T.length&&!(x.topics||[]).some(t=>T.includes(t)))return false;
  if(exc!=="year"&&Y.length&&!Y.includes(String(x.year)))return false;
  if(exc!=="wl"&&W.length&&!W.includes(String(x.word_limit)))return false;
  return true;
}
function wlOpts(items){return uniq(items.map(x=>x.word_limit).filter(w=>w!=null)).sort((a,b)=>a-b).map(w=>({v:String(w),l:w+" words"}));}
function showOK(x){const S=MSel.values("show");return !S.length||S.some(s=>s==="book"?Store.isBookmarked("optional",x.id):s==="rev"?Store.isRevise("optional",x.id):false);}
function refreshFacets(){
  MSel.setOptions("subject",uniq(DATA.filter(x=>facetOK(x,"subject")).map(x=>x._subject)).filter(s=>s&&s!=="—").sort());
  MSel.setOptions("paper",uniq(DATA.filter(x=>facetOK(x,"paper")).map(x=>x._label)).sort(paperSort));
  MSel.setOptions("topic",uniq(DATA.filter(x=>facetOK(x,"topic")).flatMap(x=>x.topics||[])).filter(Boolean).sort());
  MSel.setOptions("year",uniq(DATA.filter(x=>facetOK(x,"year")).map(x=>String(x.year)).filter(Boolean)).sort((a,b)=>b-a));
  MSel.setOptions("wl",wlOpts(DATA.filter(x=>facetOK(x,"wl"))));
}
function apply(){
  const q=$("q").value.toLowerCase().trim(),sort=$("sort").value;
  view=DATA.filter(x=>facetOK(x)&&showOK(x)&&(!q||x._search.includes(q)));
  view.sort((a,b)=>sort==="yearA"?a.year-b.year||a.q_number-b.q_number:b.year-a.year||a.q_number-b.q_number);
  $("count").textContent=view.length.toLocaleString()+" results";
  render();
}
function render(){
  const start=page*PER,items=view.slice(start,start+PER);
  const pages=Math.ceil(view.length/PER)||1;
  $("list").className="";
  $("list").innerHTML=items.length?items.map(card).join(""):'<div class="loading">No matches.</div>';
  const pg=pages>1?`<button ${page<=0?'disabled':''} onclick="go(-1)">← Prev</button><span>Page ${page+1} / ${pages}</span><button ${page>=pages-1?'disabled':''} onclick="go(1)">Next →</button>`:"";
  $("pager").innerHTML=pg; $("pagertop").innerHTML=pg;
  items.forEach(x=>{try{wire(x);}catch(e){console.warn("wire skipped:",x.id,e);}});
  window.scrollTo({top:0,behavior:"smooth"});
}
window.go=d=>{page+=d;render()};

function card(x){
  const topics=(x.topics||[]).slice(0,3).map(t=>`<span class="chip topic">${esc(t)}</span>`).join("");
  const wl=x.word_limit?`<span class="chip wl">${x.word_limit} words</span>`:"";
  const pend=x.has_answer===false?'<span class="note">Model answer pending.</span>':"";
  return `<div class="card" id="c-${x.id}">
    <div class="chead" onclick="toggle('${x.id}')">
      <div class="badge"><div class="y">${x.year||'—'}</div><div class="q">Q${x.q_number||''}</div></div>
      <div style="flex:1;min-width:0">
        <div class="stem">${hl(inline(x._title))}</div>
        <div class="chips">
          <span class="chip opt">${esc(x._subject)}</span><span class="chip paper">${x._label}</span>${wl}${topics}
        </div>
      </div>
      <div class="cact">
        <button class="iconbtn ${Store.isBookmarked("optional",x.id)?'on':''}" title="Bookmark" onclick="event.stopPropagation();tBook('${x.id}',this)">★</button>
        <button class="iconbtn ${Store.isRevise("optional",x.id)?'on':''}" title="Mark for revision" onclick="event.stopPropagation();tRev('${x.id}',this)">⚑</button>
      </div>
    </div>
    <div class="body">
      ${x._caseQ?`<div class="ans show caseq">${renderMath(mdToHtml(x._caseQ))}</div>`:""}
      <div class="bar">
        ${x.has_answer===false?pend:`<button class="btn" id="b-${x.id}">Reveal model answer</button><span class="note">Try framing your own answer first.</span>`}
      </div>
      <div class="ans" id="a-${x.id}"></div>
    </div></div>`;
}
function wire(x){
  const btn=$("b-"+x.id); if(!btn) return;
  btn.addEventListener("click",()=>{
    const a=$("a-"+x.id);
    a.innerHTML=renderMath(mdToHtml(x._ans||x.body_md||""));
    a.classList.add("show");
    btn.style.display="none";
  });
}
window.toggle=id=>$("c-"+id).classList.toggle("open");
window.tBook=(id,btn)=>{const on=Store.toggleBookmark("optional",id);btn.classList.toggle("on",on);if(MSel.values("show").length)apply();};
window.tRev=(id,btn)=>{const on=Store.toggleRevise("optional",id);btn.classList.toggle("on",on);if(MSel.values("show").length)apply();};
</script>
</body>
</html>
