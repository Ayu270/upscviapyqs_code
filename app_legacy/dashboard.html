<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC via PYQs — My Progress</title>
<script src="store.js"></script>
<style>
:root{
  --navy:#16223E;--navy2:#1E3358;--gold:#D4A843;--gold-d:#B8922A;
  --cream:#FAF7F0;--bg:#F0E8D6;--card:#FFFFFF;--text:#1E1E2E;--muted:#7A7A8A;
  --border:#E5DECF;--green:#1A8040;--green-bg:#EAF7EE;--red:#AA3030;--red-bg:#FBEFEF;--blue:#2A5C8A;--radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold);gap:16px;flex-wrap:wrap}
.header h1{font-size:20px;font-weight:800}.header h1 span{color:var(--gold)}
.header .tag{font-size:11px;color:rgba(255,255,255,.6)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);text-decoration:none;padding:6px 12px;border-radius:20px;border:1.5px solid transparent}
.nav a:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.nav a.active{color:var(--navy);background:var(--gold);border-color:var(--gold)}
.wrap{max-width:900px;margin:0 auto;padding:24px}
h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:26px 0 12px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;text-align:center}
.tile .big{font-size:34px;font-weight:800;color:var(--navy);line-height:1.1}
.tile .big .u{font-size:16px;color:var(--muted);font-weight:700}
.tile .lab{font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.tile .sub{font-size:11px;color:var(--muted);margin-top:3px}
.tile.gold{background:linear-gradient(135deg,#FBF3DC,#F7ECCB);border-color:var(--gold)}
.tile.gold .big{color:var(--gold-d)}
.bars{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:8px 16px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border)}
.row:last-child{border-bottom:none}
.row .name{flex:0 0 150px;font-size:13px;font-weight:600}
.row .track{flex:1;background:var(--cream);border-radius:20px;height:16px;overflow:hidden;border:1px solid var(--border)}
.row .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-d));border-radius:20px}
.row .val{flex:0 0 88px;text-align:right;font-size:12px;color:var(--muted);font-weight:700}
.row .fill.cov{background:linear-gradient(90deg,var(--blue),var(--navy))}
.subhead{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 5px}
.streakbar{background:linear-gradient(135deg,#FBF3DC,#F7ECCB);border:1.5px solid var(--gold);border-radius:var(--radius);padding:11px 16px;font-size:13.5px;color:var(--gold-d);font-weight:700;margin-bottom:16px}
.streakbar b{color:var(--navy);font-weight:800}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tab{font-size:14px;font-weight:800;padding:10px 20px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;margin-bottom:-2px}
.tab:hover{color:var(--navy)}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.panel[hidden]{display:none}
.panel h2:first-child{margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kcard{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kcard .kt{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:8px}
.kcard a{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--gold-d);margin-right:14px}
.kcard a:hover{text-decoration:underline}
.kcard .muted{color:var(--muted);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.actions a{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--navy);font-weight:700;font-size:13px;text-decoration:none;padding:10px 16px;border-radius:8px}
.actions a.ghost{background:#fff;border:1.5px solid var(--border);color:var(--navy)}
.empty{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:36px;text-align:center;color:var(--muted)}
.empty a{color:var(--gold-d);font-weight:700;text-decoration:none}
.reset{margin-top:30px;text-align:center}
.reset button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
@media(max-width:620px){.hero{grid-template-columns:1fr}.row .name{flex-basis:110px}}
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="header">
  <div><a href="index.html" class="brand"><h1>UPSC via <span>PYQs</span></h1></a><div class="tag">My Progress · saved on this device</div></div>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="prelims.html">Prelims</a>
    <a href="mains.html">Mains</a>
    <a href="optional.html">Optional</a>
    <a href="frameworks.html">Frameworks</a>
    <a href="practice.html">Practice</a>
    <a href="dashboard.html" class="active">Dashboard</a>
  </div>
  <div class="tag" id="hstreak"></div>
</div>
<div class="wrap" id="wrap"><div class="empty">Loading your progress…</div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KINDS=[["prelims","Prelims","prelims.html"],["mains","Mains","mains.html"],["optional","Optional","optional.html"],["framework","Frameworks","frameworks.html"]];

function bars(map, total){ // map: {label:{n,c}} → accuracy bars sorted by attempts
  const rows=Object.keys(map).sort((a,b)=>map[b].n-map[a].n).map(k=>{
    const o=map[k], pct=o.n?Math.round(100*o.c/o.n):0;
    return `<div class="row"><div class="name">${esc(String(k))}</div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="val">${pct}% · ${o.c}/${o.n}</div></div>`;
  }).join("");
  return `<div class="bars">${rows||'<div class="row"><div class="muted">No data yet.</div></div>'}</div>`;
}

/* ---- Mains/Optional coverage (practised ÷ total) ---- */
const TOPIC_WHITELIST={   // canonical per-paper taxonomy, mirrors mains.html (drops cross-tagged strays)
  GS1:["Indian Culture","Indian History","Geography","Indian Society","World History"],
  GS2:["Polity","Governance","Social Justice","International Relations"],
  GS3:["Economy","Environment","Science and Technology","Internal Security","Disaster Management"],
  GS4:["Ethics","Ethics in Civil Services","Moral Thinkers and Philosophers","Case Study"]
};
const paperLabel=p=>(p||"").replace("General Studies ","GS");   // "General Studies 1"→"GS1", "Essay"/"Paper 1" unchanged
function mainsTopicKeys(r){ const wl=TOPIC_WHITELIST[paperLabel(r.paper)], ts=r.topics||[]; return wl?ts.filter(t=>wl.includes(t)):ts; }
const subhead=t=>`<div class="subhead">${t}</div>`;
function covByKey(records, doneSet, keyFn){   // map: {label:{done,total}}
  const map={};
  records.forEach(r=>{ keyFn(r).forEach(k=>{ if(k==null||k==="")return; const o=map[k]||(map[k]={done:0,total:0}); o.total++; if(doneSet.has(String(r.id)))o.done++; }); });
  return map;
}
function coverageBars(map, order){   // rows = only groups you've TOUCHED (done>0); width/value = done/total
  const keys=Object.keys(map).filter(k=>map[k].done>0);
  keys.sort((a,b)=> order ? ((order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b))) : (map[b].total-map[a].total));
  const rows=keys.map(k=>{ const o=map[k], pct=o.total?Math.round(100*o.done/o.total):0;
    return `<div class="row"><div class="name">${esc(String(k))}</div>
      <div class="track"><div class="fill cov" style="width:${pct}%"></div></div>
      <div class="val">${o.done}/${o.total}</div></div>`;
  }).join("");
  return `<div class="bars">${rows||'<div class="row"><div class="muted">No data yet.</div></div>'}</div>`;
}

function render(records, MAINS, OPT){
  const st=Store.stats(records||[]);
  const sk=Store.streak();
  $("hstreak").textContent=(sk.count>0?("🔥 "+sk.count+"-day streak"):"");
  MAINS=MAINS||[]; OPT=OPT||[];
  const mDoneSet=new Set(Store.practicedIds("mains")), oDoneSet=new Set(Store.practicedIds("optional"));
  const mDone=mDoneSet.size, oDone=oDoneSet.size;
  const anyData=KINDS.some(k=>Store.bookmarks(k[0]).length||Store.reviseList(k[0]).length)||mDone||oDone;

  if(st.total===0 && !anyData){
    $("wrap").innerHTML='<div class="empty">No progress yet.<br><br>Head to the <a href="prelims.html">Prelims explorer</a> and attempt a few questions — your accuracy, streak, bookmarks and revision list will show up here.<br><br>Or jump into <a href="practice.html">Practice mode</a>.</div>';
    return;
  }

  const kcard=(kind,label,page)=>{
    const b=Store.bookmarks(kind).length, r=Store.reviseList(kind).length;
    const link=(n,q,txt)=>n?`<a href="${page}?${q}">${txt} (${n})</a>`:`<span class="muted">${txt} (0)</span>`;
    return `<div class="kcard"><div class="kt">${label}</div>${link(b,"show=book","★ Bookmarked")}${link(r,"show=rev","⚑ Revision")}</div>`;
  };

  // ---- Prelims panel (accuracy) ----
  const prelimsPanel=`
    <div class="hero">
      <div class="tile"><div class="big">${st.total}</div><div class="lab">Attempted</div><div class="sub">practice + explorer</div></div>
      <div class="tile"><div class="big">${st.accuracy}<span class="u">%</span></div><div class="lab">Accuracy</div><div class="sub">${st.correct} correct</div></div>
      <div class="tile"><div class="big">${st.bookmarks}</div><div class="lab">Bookmarked</div><div class="sub">★ saved</div></div>
    </div>
    ${st.total?`<h2>Accuracy by subject</h2>${bars(st.bySubject)}<h2>Accuracy by year</h2>${bars(st.byYear)}`
              :'<div class="empty" style="padding:30px">No Prelims attempts yet — <a href="prelims.html">open the explorer →</a> and answer a few.</div>'}
    <h2>Saved &amp; flagged</h2><div class="cards">${kcard("prelims","Prelims","prelims.html")}</div>
    <h2>Pick up where it matters</h2>
    <div class="actions">
      <a href="prelims.html?show=wrong">Review questions you got wrong</a>
      <a class="ghost" href="prelims.html?show=unatt">Continue unattempted</a>
      <a class="ghost" href="practice.html">Start a practice set</a>
    </div>`;

  // ---- Mains/Optional panel (coverage) ----
  function writingPanel(label, page, kind, DATA, doneSet, paperKeyFn, paperOrder, topicKeyFn, sub, extraCard){
    const done=doneSet.size, total=DATA.length, pct=total?Math.round(100*done/total):0;
    if(!done){
      return `<div class="empty" style="padding:34px">No ${label} answers practised yet.<br><br>Open <a href="practice.html">Practice</a>, choose <b>${label}</b>, write an answer and hit “Submit &amp; check” — your coverage by paper and topic will build up here.</div>`;
    }
    let acts="";
    if(kind==="mains"){
      const pm=covByKey(DATA,doneSet,paperKeyFn);
      const least=Object.keys(pm).filter(k=>pm[k].total).sort((a,b)=>(pm[a].done/pm[a].total)-(pm[b].done/pm[b].total))[0];
      if(least) acts+='<a href="'+page+'?paper='+encodeURIComponent(least)+'">Practice your least-covered paper ('+esc(least)+')</a>';
    }
    acts+='<a class="ghost" href="practice.html">Practice a'+(label==="Optional"?"n":"")+' '+label+' answer</a>';
    if(Store.reviseList(kind).length) acts+='<a class="ghost" href="'+page+'?show=rev">Review flagged '+label+'</a>';
    return `
      <div class="hero">
        <div class="tile"><div class="big">${done}<span class="u"> /${total}</span></div><div class="lab">Answers practised</div><div class="sub">model answers written</div></div>
        <div class="tile gold"><div class="big">${pct}<span class="u">%</span></div><div class="lab">Syllabus covered</div><div class="sub">${sub}</div></div>
      </div>
      <h2>Practised so far</h2>
      ${subhead("By paper")}${coverageBars(covByKey(DATA,doneSet,paperKeyFn),paperOrder)}
      ${subhead("By topic")}${coverageBars(covByKey(DATA,doneSet,topicKeyFn))}
      <h2>Saved &amp; flagged</h2><div class="cards">${kcard(kind,label,page)}${extraCard||""}</div>
      <h2>Pick up where it matters</h2><div class="actions">${acts}</div>`;
  }

  const mainsPanel=writingPanel("Mains","mains.html","mains",MAINS,mDoneSet,r=>[paperLabel(r.paper)],["GS1","GS2","GS3","GS4","Essay"],mainsTopicKeys,"GS1–4 &amp; Essay",kcard("framework","Frameworks","frameworks.html"));
  const optPanel=writingPanel("Optional","optional.html","optional",OPT,oDoneSet,r=>[r.paper],["Paper 1","Paper 2"],r=>r.topics||[],"Public Administration","");

  $("wrap").innerHTML=`
    <div class="streakbar">🔥 <b>${sk.count}</b>-day streak · best <b>${sk.best}</b> <span style="color:var(--muted);font-weight:600">· progress saved on this device</span></div>
    <div class="tabs">
      <button class="tab" data-t="prelims">Prelims</button>
      <button class="tab" data-t="mains">Mains</button>
      <button class="tab" data-t="optional">Optional</button>
    </div>
    <div class="panel" id="p-prelims">${prelimsPanel}</div>
    <div class="panel" id="p-mains" hidden>${mainsPanel}</div>
    <div class="panel" id="p-optional" hidden>${optPanel}</div>
    <div class="reset"><button onclick="if(confirm('Clear all saved progress on this device? This cannot be undone.')){Store.reset();location.reload();}">Reset all progress</button></div>
  `;
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.t)));
  setTab(Store.getPref("dashTab","prelims"));
}

function setTab(name){
  if(!document.getElementById("p-"+name)) name="prelims";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.t===name));
  ["prelims","mains","optional"].forEach(n=>{ const el=document.getElementById("p-"+n); if(el) el.hidden=(n!==name); });
  Store.setPref("dashTab",name);
}

// prelims → accuracy by subject/year; mains/optional → writing coverage; degrade gracefully if offline
Promise.all([
  fetch("../data/prelims_structured.json").then(r=>r.json()).catch(()=>[]),
  fetch("../data/mains.json").then(r=>r.json()).catch(()=>[]),
  fetch("../data/optional.json").then(r=>r.json()).catch(()=>[])
]).then(([p,m,o])=>{
  const recs=(Array.isArray(p)?p:[]).map(x=>({id:x.id,subject:x.subject,year:x.year}));
  render(recs, Array.isArray(m)?m:[], Array.isArray(o)?o:[]);
}).catch(()=>render([],[],[]));
</script>
</body>
</html>
