<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC via PYQs — Practice</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="msel.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>
<script src="store.js"></script>
<script src="md.js"></script>
<script src="msel.js"></script>
<style>
:root{
  --navy:#16223E;--navy2:#1E3358;--gold:#D4A843;--gold-d:#B8922A;
  --cream:#FAF7F0;--bg:#F0E8D6;--card:#FFFFFF;--text:#1E1E2E;--muted:#7A7A8A;
  --border:#E5DECF;--green:#1A8040;--green-bg:#EAF7EE;--red:#AA3030;--red-bg:#FBEFEF;--blue:#2A5C8A;--radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold);gap:16px;flex-wrap:wrap}
.header h1{font-size:20px;font-weight:800}.header h1 span{color:var(--gold)}
.header .tag{font-size:11px;color:rgba(255,255,255,.6)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);text-decoration:none;padding:6px 12px;border-radius:20px;border:1.5px solid transparent}
.nav a:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.nav a.active{color:var(--navy);background:var(--gold);border-color:var(--gold)}
.wrap{max-width:760px;margin:0 auto;padding:24px}
.panel{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px 24px}
.panel h2{font-size:16px;color:var(--navy);margin-bottom:4px}
.panel p.hint{font-size:13px;color:var(--muted);margin-bottom:18px}
.back{font-size:12px;color:var(--gold-d);font-weight:700;cursor:pointer;display:inline-block;margin-bottom:12px}
/* mode picker */
.modecards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.modecard{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px 18px;text-align:center;cursor:pointer;transition:.15s}
.modecard:hover{border-color:var(--gold);box-shadow:0 6px 20px rgba(212,168,67,.13);transform:translateY(-3px)}
.modecard .mi{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#F7F0DC,#F2E6C4);border:1px solid var(--border);font-size:24px;margin-bottom:11px}
.modecard:hover .mi{border-color:var(--gold)}
.modecard .mt{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:5px}
.modecard .md{font-size:12.5px;color:var(--muted);line-height:1.5}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.field select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;background:var(--cream)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--border);background:var(--cream);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{padding:11px 22px;border:none;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;border:1.5px solid var(--border);color:var(--navy);font-weight:700}
.progressbar{height:6px;background:var(--border);border-radius:20px;overflow:hidden;margin-bottom:4px}
.progressbar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-d))}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 14px;flex-wrap:wrap;gap:6px}
.timer{font-variant-numeric:tabular-nums}.timer.low{color:var(--red)}
.stem{font-size:15.5px;line-height:1.65;font-weight:500;margin-bottom:14px}
.stem p{margin:0 0 6px}.stem table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px;display:block;overflow-x:auto}
.stem th,.stem td{border:1px solid var(--border);padding:6px 9px}.stem th{background:#F7F0DC}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-block;font-size:10px;font-weight:700;border-radius:20px;padding:3px 10px;text-transform:uppercase;letter-spacing:.4px;color:var(--navy);background:var(--gold)}
.chip.meta{color:var(--muted);background:var(--cream);border:1px solid var(--border);text-transform:none;letter-spacing:0}
/* MCQ */
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.opt{display:flex;gap:10px;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--cream);cursor:pointer;font-size:14.5px;line-height:1.5;transition:.12s}
.opt:hover{border-color:var(--gold)}.opt.sel{border-color:var(--navy);background:#F4F0E0}
.opt .l{font-weight:800;color:var(--navy)}
.opt.correct{border-color:var(--green);background:var(--green-bg)}.opt.correct .l{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}.opt.wrong .l{color:var(--red)}
/* writing */
.answerbox{width:100%;min-height:200px;border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;font-size:14px;font-family:inherit;line-height:1.6;background:#fff;resize:vertical}
.answerbox:focus{outline:none;border-color:var(--gold)}
.wordcount{font-size:12px;color:var(--muted);font-weight:700;text-align:right;margin:4px 0 14px}.wordcount.over{color:var(--red)}
.estimate{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:8px}
.covnote{font-size:14px;font-weight:800;color:var(--navy);margin:8px 0 10px}
.checklist{margin-bottom:6px}
.ckitem{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13.5px;cursor:pointer}
.ckitem:last-child{border-bottom:none}
.ckbox{width:18px;height:18px;border:1.5px solid var(--border);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px}
.ckitem.on .ckbox{background:var(--green);border-color:var(--green)}
.ckitem .cktx{color:var(--muted)}.ckitem.on .cktx{color:var(--text);font-weight:600}
.youranswer{background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap;margin:10px 0;line-height:1.55}
.modelans{border-top:1px dashed var(--border);margin-top:14px;padding-top:12px;font-size:13.5px;line-height:1.62}
.modelans h2,.modelans h3,.modelans h4{font-size:14px;color:var(--navy);margin:13px 0 5px}
.modelans .mdsub{font-weight:800;color:var(--navy2);margin:11px 0 3px}
.modelans p{margin:6px 0}.modelans ul,.modelans ol{margin:6px 0 6px 20px}.modelans li{margin:3px 0}
.modelans hr{border:none;border-top:1px dashed var(--border);margin:10px 0}
.modelans table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px;display:block;overflow-x:auto}
.modelans th,.modelans td{border:1px solid var(--border);padding:5px 8px}.modelans th{background:#F7F0DC}
.subhd{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 8px}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.katex-display{overflow-x:auto;max-width:100%}
/* results */
.scorehero{text-align:center;padding:10px 0 18px}
.scorehero .pct{font-size:48px;font-weight:800;color:var(--navy)}
.scorehero .det{font-size:14px;color:var(--muted)}
.rev{margin-top:6px}
.revq{border:1.5px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px;font-size:13.5px}
.revq.ok{border-left:4px solid var(--green)}.revq.no{border-left:4px solid var(--red)}.revq.skip{border-left:4px solid var(--muted)}
.revq .qx{font-weight:600;margin-bottom:4px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.revq .qx .exp{color:var(--muted);font-size:11px;flex-shrink:0}
.revq .ax{font-size:12px;color:var(--muted)}
.revbody{display:none;font-size:13px;line-height:1.6;border-top:1px dashed var(--border);margin-top:9px;padding-top:9px}
.revbody p{margin:6px 0}.revbody ul,.revbody ol{margin:6px 0 6px 20px}.revbody li{margin:3px 0}
.revbody table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px;display:block;overflow-x:auto}
.revbody th,.revbody td{border:1px solid var(--border);padding:5px 8px}.revbody th{background:#F7F0DC}
.loading{text-align:center;padding:60px;color:var(--muted)}
@media(max-width:620px){.modecards{grid-template-columns:1fr}.wrap{padding:16px}.panel{padding:18px}}
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="header">
  <div><a href="index.html" class="brand"><h1>UPSC via <span>PYQs</span></h1></a><div class="tag">Practice · scored MCQs &amp; timed answer-writing</div></div>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="prelims.html">Prelims</a>
    <a href="mains.html">Mains</a>
    <a href="optional.html">Optional</a>
    <a href="frameworks.html">Frameworks</a>
    <a href="practice.html" class="active">Practice</a>
    <a href="dashboard.html">Dashboard</a>
  </div>
  <div class="tag" id="hcount"></div>
</div>
<div class="wrap" id="wrap"><div class="loading">Loading…</div></div>

<script>
let KIND=null, DATA=[], CACHE={}, quiz=[], idx=0, answers={}, startTs=0, timerId=null, timeLeft=0, perSet=false;
const TOPIC_WHITELIST={
  "General Studies 1":["Indian Culture","Indian History","Geography","Indian Society","World History"],
  "General Studies 2":["Polity","Governance","Social Justice","International Relations"],
  "General Studies 3":["Economy","Environment","Science and Technology","Internal Security","Disaster Management"],
  "General Studies 4":["Ethics","Ethics in Civil Services","Moral Thinkers and Philosophers","Case Study"]
};
const $=id=>document.getElementById(id);
const strip=h=>(h||"").replace(/<[^>]+>/g," ");
function renderMath(html){
  if(!window.katex||!html||html.indexOf("\\")<0)return html||"";
  return html.replace(/\\\[([\s\S]+?)\\\]/g,(m,e)=>{try{return katex.renderToString(e,{displayMode:true,throwOnError:false})}catch(_){return m}})
             .replace(/\\\(([\s\S]+?)\\\)/g,(m,e)=>{try{return katex.renderToString(e,{displayMode:false,throwOnError:false})}catch(_){return m}});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(s){const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");}
function flash(btn,msg){const o=btn.textContent;btn.textContent=msg;setTimeout(()=>btn.textContent=o,1200);}
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function tick(onZero){ stopTimer(); timerId=setInterval(()=>{ timeLeft--; const t=$("timer"); if(t){t.textContent="⏱ "+fmt(Math.max(timeLeft,0));t.classList.toggle("low",timeLeft<=30);} if(timeLeft<=0){stopTimer();onZero();} },1000); }

/* ---------- entry: mode picker ---------- */
pickMode();
function pickMode(){
  KIND=null; stopTimer(); $("hcount").textContent="";
  $("wrap").innerHTML=`<div class="panel"><h2>Choose a practice mode</h2>
    <p class="hint">Prelims is auto-scored. Mains &amp; Optional are timed answer-writing with a self-check against the model answer.</p>
    <div class="modecards">
      <div class="modecard" onclick="start('prelims')"><div class="mi">📝</div><div class="mt">Prelims</div><div class="md">MCQ test — pick, submit, scored %</div></div>
      <div class="modecard" onclick="start('mains')"><div class="mi">✍️</div><div class="mt">Mains</div><div class="md">Write answers under time &amp; word limit</div></div>
      <div class="modecard" onclick="start('optional')"><div class="mi">📚</div><div class="mt">Optional</div><div class="md">Write Optional-paper answers</div></div>
    </div></div>`;
}
window.start=kind=>{
  if(CACHE[kind]){ KIND=kind; DATA=CACHE[kind]; afterLoad(); return; }
  $("wrap").innerHTML='<div class="loading">Loading question bank…</div>';
  const file=kind==="prelims"?"prelims_structured.json":kind+".json";
  fetch("../data/"+file).then(r=>r.json()).then(d=>{
    CACHE[kind]=d; KIND=kind; DATA=d; afterLoad();
  }).catch(()=>{$("wrap").innerHTML='<div class="loading">Could not load questions. Serve via <code>python3 serve.py</code>.<br><br><span class="back" onclick="pickMode()">← back</span></div>';});
};
function afterLoad(){
  if(KIND==="prelims"){ DATA=DATA.filter(x=>x.options&&x.options.length&&x.correct_answer); setupMCQ(); }
  else { DATA=DATA.filter(x=>x.has_answer!==false && (x.body_md||"").trim()); setupWrite(); }
  $("hcount").textContent=DATA.length.toLocaleString()+" questions";
}

/* ============================ PRELIMS · MCQ ============================ */
function setupMCQ(){
  const subjects=[...new Set(DATA.map(x=>x.subject).filter(Boolean))].sort();
  const years=[...new Set(DATA.map(x=>x.year).filter(Boolean))].sort((a,b)=>b-a);
  $("wrap").innerHTML=`<div class="panel">
    <span class="back" onclick="pickMode()">← all modes</span>
    <h2>Prelims practice set</h2><p class="hint">Attempt-first, one at a time. Scored, and saved to your dashboard.</p>
    <div class="field"><label>Subject</label><div id="cSubject"></div></div>
    <div class="field"><label>Year</label><div id="cYear"></div></div>
    <div class="field"><label>Number of questions</label><div class="chiprow" id="cCount">${[10,20,30,50].map((n,i)=>`<span class="pill${i===0?' on':''}" data-n="${n}">${n}</span>`).join("")}</div></div>
    <div class="field"><label>Timer</label><div class="chiprow" id="cTimer"><span class="pill on" data-s="0">Off</span><span class="pill" data-s="60">1 min/Q</span><span class="pill" data-s="90">1.5 min/Q</span></div></div>
    <div style="margin-top:20px"><button class="btn" id="startBtn">Start →</button><span class="hint" id="poolNote" style="margin-left:12px"></span></div>
  </div>`;
  let count=10, perQ=0;
  MSel.create("cSubject",{key:"cSubject",label:"All subjects"}); MSel.setOptions("cSubject",subjects);
  MSel.create("cYear",{key:"cYear",label:"All years"}); MSel.setOptions("cYear",years.map(String));
  const pool=()=>DATA.filter(x=>{const S=MSel.values("cSubject"),Y=MSel.values("cYear");return (!S.length||S.includes(x.subject))&&(!Y.length||Y.includes(String(x.year)));});
  const note=()=>{const p=pool().length;$("poolNote").textContent=p+" available"+(p<count?" — set trimmed to "+p:"");};
  $("cCount").querySelectorAll(".pill").forEach(p=>p.onclick=()=>{$("cCount").querySelectorAll(".pill").forEach(z=>z.classList.remove("on"));p.classList.add("on");count=+p.dataset.n;note();});
  $("cTimer").querySelectorAll(".pill").forEach(p=>p.onclick=()=>{$("cTimer").querySelectorAll(".pill").forEach(z=>z.classList.remove("on"));p.classList.add("on");perQ=+p.dataset.s;});
  MSel.onChange(note); note();
  $("startBtn").onclick=()=>{
    const p=pool(); if(!p.length){$("poolNote").textContent="No questions match — widen the filters.";return;}
    quiz=shuffle(p.slice()).slice(0,Math.min(count,p.length)); idx=0; answers={}; startTs=Date.now();
    if(perQ>0){ timeLeft=perQ*quiz.length; tick(finishMCQ); } else timeLeft=0;
    showMCQ();
  };
}
function showMCQ(){
  const x=quiz[idx], last=idx===quiz.length-1, pct=Math.round(100*idx/quiz.length);
  const opts=(x.options||[]).map(o=>`<label class="opt" data-l="${o.letter}"><span class="l">(${o.letter})</span><span>${o.html}</span></label>`).join("");
  $("wrap").innerHTML=`<div class="panel">
    <div class="progressbar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="qmeta"><span>Question ${idx+1} of ${quiz.length}</span><span>${x.subject||""} · ${x.year||""} ${timerId?`&nbsp;<span class="timer" id="timer">⏱ ${fmt(Math.max(timeLeft,0))}</span>`:""}</span></div>
    <div class="stem">${renderMath(x.stem_html)}</div>
    <div class="opts" id="opts">${opts}</div>
    <div class="navbtns"><button class="btn ghost" id="quitBtn">End &amp; score</button>
      <div style="display:flex;gap:10px"><button class="btn ghost" id="skipBtn">Skip</button><button class="btn" id="submitBtn">${last?'Submit &amp; finish →':'Submit &amp; next →'}</button></div></div>
    <div style="font-size:11px;color:var(--muted);text-align:right;margin-top:8px">Keys: 1–4 / a–d choose · Enter submit · S skip</div>
  </div>`;
  let chosen=null; const optEls=$("opts").querySelectorAll(".opt");
  optEls.forEach(o=>o.onclick=()=>{ optEls.forEach(z=>z.classList.remove("sel")); o.classList.add("sel"); chosen=o.dataset.l; });
  $("quitBtn").onclick=()=>{ if(confirm("End now and see your score?")) finishMCQ(); };
  $("skipBtn").onclick=()=>nextMCQ();
  $("submitBtn").onclick=()=>{
    if(!chosen){ flash($("submitBtn"),"Pick an option"); return; }
    const correct=(x.correct_answer||"").toLowerCase(), ok=chosen===correct;
    answers[x.id]={chosen,correct:ok}; Store.recordAttempt(x.id,chosen,ok); nextMCQ();
  };
}
function nextMCQ(){ if(idx<quiz.length-1){ idx++; showMCQ(); } else finishMCQ(); }
window.toggleRev=el=>{ const b=el.parentNode.querySelector(".revbody"); const open=b.style.display==="block"; b.style.display=open?"none":"block"; el.querySelector(".exp").textContent=open?"▸":"▾"; };
function finishMCQ(){
  stopTimer();
  const done=quiz.filter(x=>answers[x.id]), correct=done.filter(x=>answers[x.id].correct).length;
  const pct=done.length?Math.round(100*correct/done.length):0, secs=Math.round((Date.now()-startTs)/1000);
  const wrongIds=quiz.filter(x=>answers[x.id]&&!answers[x.id].correct).map(x=>x.id);
  const rev=quiz.map(x=>{ const a=answers[x.id], corr=(x.correct_answer||"").toLowerCase();
    const cls=a?(a.correct?'ok':'no'):'skip', mark=a?(a.correct?'✓':'✗'):'•';
    const line=a?`Your answer: (${a.chosen}) · Correct: (${corr})`:`Skipped · Correct: (${corr})`;
    return `<div class="revq ${cls}"><div class="qx" onclick="toggleRev(this)">${mark} ${strip(x.stem_html).slice(0,150)}… <span class="exp">▸</span></div>
      <div class="ax">${line} · ${x.subject||''} ${x.year||''}</div><div class="revbody">${renderMath(x.analysis_html)}</div></div>`;
  }).join("");
  window._wrongIds=wrongIds; window._lastPool=quiz.slice();
  $("wrap").innerHTML=`<div class="panel">
    <div class="scorehero"><div class="pct">${pct}%</div><div class="det">${correct} / ${done.length} correct${done.length<quiz.length?` · ${quiz.length-done.length} skipped`:""} · ${fmt(secs)} taken</div></div>
    <div class="navbtns" style="justify-content:center;flex-wrap:wrap">
      ${wrongIds.length?`<button class="btn" id="retryWrong">Retry ${wrongIds.length} wrong</button>`:""}
      <button class="btn ghost" id="again">New set</button>
      <button class="btn ghost" id="bookWrong" ${wrongIds.length?"":"disabled"}>★ Bookmark wrong</button>
      <a class="btn ghost" href="dashboard.html" style="text-decoration:none">Dashboard</a></div>
    <h2 class="subhd" style="margin-top:24px">Review &amp; reflect — tap a question for its analysis</h2><div class="rev">${rev}</div></div>`;
  if($("again"))$("again").onclick=setupMCQ;
  if($("retryWrong"))$("retryWrong").onclick=()=>{ quiz=window._lastPool.filter(x=>window._wrongIds.indexOf(x.id)>=0); idx=0; answers={}; startTs=Date.now(); stopTimer(); showMCQ(); };
  if($("bookWrong"))$("bookWrong").onclick=e=>{ window._wrongIds.forEach(id=>{ if(!Store.isBookmarked("prelims",id))Store.toggleBookmark("prelims",id); }); e.target.textContent="✓ Bookmarked"; e.target.disabled=true; };
}

/* ============================ MAINS / OPTIONAL · WRITE ============================ */
function setupWrite(){
  const isOpt=KIND==="optional";
  const papers=[...new Set(DATA.map(x=>x.paper).filter(Boolean))].sort();
  const subjects=isOpt?[...new Set(DATA.map(x=>x.optional_subject).filter(Boolean))].sort():[];
  const topics=[...new Set(DATA.flatMap(x=>x.topics||[]))].filter(Boolean).sort();
  $("wrap").innerHTML=`<div class="panel">
    <span class="back" onclick="pickMode()">← all modes</span>
    <h2>${isOpt?'Optional':'Mains'} answer-writing</h2>
    <p class="hint">Write your answer under time &amp; word limit, then self-check it against the model answer.</p>
    ${isOpt?`<div class="field"><label>Subject</label><div id="cSubject"></div></div>`:""}
    <div class="field"><label>Paper</label><div id="cPaper"></div></div>
    <div class="field"><label>Topic</label><div id="cTopic"></div></div>
    <div class="field"><label>Word limit</label><div id="cWl"></div></div>
    <div class="field"><label>Number of questions</label><div class="chiprow" id="cCount">${[3,5,10].map((n,i)=>`<span class="pill${i===0?' on':''}" data-n="${n}">${n}</span>`).join("")}</div></div>
    <div class="field"><label>Timer</label><div class="chiprow" id="cTimer"><span class="pill on" data-t="0">Off</span><span class="pill" data-t="1">Exam pace (by word limit)</span></div></div>
    <div style="margin-top:20px"><button class="btn" id="startBtn">Start →</button><span class="hint" id="poolNote" style="margin-left:12px"></span></div>
  </div>`;
  let count=3, timed=false;
  if(isOpt){ MSel.create("cSubject",{key:"cSubject",label:"All subjects"}); }
  MSel.create("cPaper",{key:"cPaper",label:"All papers"});
  MSel.create("cTopic",{key:"cTopic",label:"All topics"});
  MSel.create("cWl",{key:"cWl",label:"Any words"});
  const fOK=(x,exc)=>{const Sj=isOpt?MSel.values("cSubject"):[],P=MSel.values("cPaper"),T=MSel.values("cTopic"),W=MSel.values("cWl");
    if(exc!=="cSubject"&&Sj.length&&!Sj.includes(x.optional_subject))return false;
    if(exc!=="cPaper"&&P.length&&!P.includes(x.paper))return false;
    if(exc!=="cTopic"&&T.length&&!(x.topics||[]).some(t=>T.includes(t)))return false;
    if(exc!=="cWl"&&W.length&&!W.includes(String(x.word_limit)))return false; return true;};
  const allowedTopics=()=>{ // mains: canonical per-paper taxonomy; optional: keep raw
    if(isOpt) return null;
    const sel=MSel.values("cPaper"), keys=sel.length?sel:[...new Set(DATA.map(x=>x.paper))], set=new Set();
    keys.forEach(p=>{ if(TOPIC_WHITELIST[p]) TOPIC_WHITELIST[p].forEach(t=>set.add(t));
      else DATA.filter(x=>x.paper===p).forEach(x=>(x.topics||[]).forEach(t=>set.add(t))); });
    return set;
  };
  const refresh=()=>{ // dependent options: Paper → Topic, etc.
    if(isOpt)MSel.setOptions("cSubject",[...new Set(DATA.filter(x=>fOK(x,"cSubject")).map(x=>x.optional_subject))].filter(Boolean).sort());
    MSel.setOptions("cPaper",[...new Set(DATA.filter(x=>fOK(x,"cPaper")).map(x=>x.paper))].filter(Boolean).sort());
    const al=allowedTopics();
    MSel.setOptions("cTopic",[...new Set(DATA.filter(x=>fOK(x,"cTopic")).flatMap(x=>x.topics||[]))].filter(t=>t&&(!al||al.has(t))).sort());
    MSel.setOptions("cWl",[...new Set(DATA.filter(x=>fOK(x,"cWl")).map(x=>x.word_limit).filter(w=>w!=null))].sort((a,b)=>a-b).map(w=>({v:String(w),l:w+" words"})));
  };
  const pool=()=>DATA.filter(x=>fOK(x));
  const note=()=>{const p=pool().length;$("poolNote").textContent=p+" available"+(p<count?" — set trimmed to "+p:"");};
  $("cCount").querySelectorAll(".pill").forEach(p=>p.onclick=()=>{$("cCount").querySelectorAll(".pill").forEach(z=>z.classList.remove("on"));p.classList.add("on");count=+p.dataset.n;note();});
  $("cTimer").querySelectorAll(".pill").forEach(p=>p.onclick=()=>{$("cTimer").querySelectorAll(".pill").forEach(z=>z.classList.remove("on"));p.classList.add("on");timed=p.dataset.t==="1";});
  MSel.onChange(()=>{refresh();note();}); refresh(); note();
  $("startBtn").onclick=()=>{
    const p=pool(); if(!p.length){$("poolNote").textContent="No questions match — widen the filters.";return;}
    quiz=shuffle(p.slice()).slice(0,Math.min(count,p.length)); idx=0; answers={}; startTs=Date.now(); perSet=timed; showWrite();
  };
}
function qMinutes(x){ return Math.min(20, Math.max(3, Math.round((x.word_limit||150)/20))); }
function showWrite(){
  const x=quiz[idx], last=idx===quiz.length-1, pct=Math.round(100*idx/quiz.length), sb=splitBody(x);
  const prior=answers[x.id]?answers[x.id].text:"";
  const wl=x.word_limit?`<span class="chip meta">${x.word_limit} words</span>`:"";
  const tp=(x.topics||[]).slice(0,3).map(t=>`<span class="chip meta">${esc(t)}</span>`).join("");
  $("wrap").innerHTML=`<div class="panel">
    <div class="progressbar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="qmeta"><span>Question ${idx+1} of ${quiz.length}</span><span>${x.paper||""}${x.optional_subject?" · "+x.optional_subject:""} ${perSet?`&nbsp;<span class="timer" id="timer">⏱ ${fmt(timeLeft)}</span>`:""}</span></div>
    <div class="stem">${inline(sb.stem)}</div>
    <div class="chips"><span class="chip">${x.paper||"Mains"}</span>${wl}${tp}</div>
    <textarea class="answerbox" id="ans" placeholder="Write your answer here — or just outline the key points you'd make, then check against the model answer.">${esc(prior)}</textarea>
    <div class="wordcount" id="wc">0 words${x.word_limit?` / ${x.word_limit}`:""}</div>
    <div class="navbtns"><button class="btn ghost" id="quitBtn">End session</button>
      <div style="display:flex;gap:10px"><button class="btn ghost" id="skipBtn">Skip</button><button class="btn" id="revealBtn">Submit &amp; check →</button></div></div>
  </div>`;
  const ta=$("ans"), wc=$("wc");
  const upd=()=>{const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0; wc.textContent=n+" words"+(x.word_limit?` / ${x.word_limit}`:""); wc.classList.toggle("over",x.word_limit&&n>x.word_limit);};
  ta.oninput=upd; upd(); ta.focus();
  if(perSet){ timeLeft=qMinutes(x)*60; tick(()=>revealWrite()); }
  $("quitBtn").onclick=()=>{ if(confirm("End the session and see your summary?")) finishWrite(); };
  $("skipBtn").onclick=()=>nextWrite();
  $("revealBtn").onclick=()=>revealWrite();
}
function revealWrite(){
  stopTimer();
  const x=quiz[idx], sb=splitBody(x), text=$("ans")?$("ans").value:"";
  const points=keyPoints(x.body_md||""), cov=coverage(text,points);
  answers[x.id]={text, points, cov, covered:cov.filter(c=>c.hit).length};
  Store.recordPractice(KIND,x.id);
  const last=idx===quiz.length-1;
  let checklist="";
  if(points.length){
    checklist=`<div class="covnote" id="covnote">Estimated coverage: ${answers[x.id].covered} / ${points.length} key points</div>
      <div class="estimate">Auto-estimate from your text — tick/untick to correct it.</div>
      <div class="checklist" id="checklist">${cov.map((c,i)=>`<div class="ckitem ${c.hit?'on':''}" data-i="${i}" onclick="ckToggle('${x.id}','${i}',this)"><div class="ckbox">✓</div><div class="cktx">${esc(c.point)}</div></div>`).join("")}</div>`;
  } else {
    checklist=`<div class="estimate">No auto-checklist for this answer — compare yours with the model answer below.</div>`;
  }
  $("wrap").innerHTML=`<div class="panel">
    <div class="qmeta"><span>Question ${idx+1} of ${quiz.length}</span><span>${x.paper||""}${x.optional_subject?" · "+x.optional_subject:""}</span></div>
    <div class="stem">${inline(sb.stem)}</div>
    ${checklist}
    ${text.trim()?`<div class="subhd">Your answer</div><div class="youranswer">${esc(text)}</div>`:""}
    <div class="subhd">Model answer</div>
    <div class="modelans">${renderMath(mdToHtml(sb.ans))}</div>
    <div class="navbtns" style="justify-content:flex-end"><button class="btn" id="nextBtn">${last?'Finish session →':'Next question →'}</button></div>
  </div>`;
  $("nextBtn").onclick=()=>nextWrite();
  window.scrollTo({top:0,behavior:"smooth"});
}
window.ckToggle=(id,i,el)=>{
  const a=answers[id]; const on=!a.cov[+i].hit; a.cov[+i].hit=on; el.classList.toggle("on",on);
  a.covered=a.cov.filter(c=>c.hit).length;
  const note=$("covnote"); if(note)note.textContent=`Estimated coverage: ${a.covered} / ${a.points.length} key points`;
};
function nextWrite(){ if(idx<quiz.length-1){ idx++; showWrite(); } else finishWrite(); }
function finishWrite(){
  stopTimer();
  const attempted=quiz.filter(x=>answers[x.id]);
  const withPts=attempted.filter(x=>answers[x.id].points.length);
  const avg=withPts.length?Math.round(100*withPts.reduce((s,x)=>s+answers[x.id].covered/answers[x.id].points.length,0)/withPts.length):null;
  const secs=Math.round((Date.now()-startTs)/1000);
  const rev=quiz.map(x=>{
    const a=answers[x.id], sb=splitBody(x);
    const cls=a?'ok':'skip', mark=a?'✓':'•';
    const cvr=a&&a.points.length?` · covered ${a.covered}/${a.points.length}`:(a?'':' · skipped');
    return `<div class="revq ${cls}"><div class="qx" onclick="toggleRev(this)">${mark} ${inline(sb.stem).replace(/<[^>]+>/g,'').slice(0,150)}… <span class="exp">▸</span></div>
      <div class="ax">${x.paper||''}${x.optional_subject?" · "+x.optional_subject:""}${cvr}</div>
      <div class="revbody">${a&&a.text.trim()?`<div class="subhd">Your answer</div><div class="youranswer">${esc(a.text)}</div>`:""}<div class="subhd">Model answer</div><div class="modelans">${renderMath(mdToHtml(sb.ans))}</div></div></div>`;
  }).join("");
  $("wrap").innerHTML=`<div class="panel">
    <div class="scorehero"><div class="pct">${attempted.length}</div><div class="det">answers practiced${avg!=null?` · ~${avg}% key-point coverage`:""} · ${fmt(secs)} this session</div></div>
    <div class="navbtns" style="justify-content:center;flex-wrap:wrap">
      <button class="btn ghost" id="again">New set</button>
      <span class="back" onclick="pickMode()" style="align-self:center">← all modes</span>
      <a class="btn ghost" href="dashboard.html" style="text-decoration:none">Dashboard</a></div>
    <h2 class="subhd" style="margin-top:24px">Review — tap a question for your answer + the model</h2><div class="rev">${rev}</div></div>`;
  if($("again"))$("again").onclick=setupWrite;
}

/* keyboard for MCQ only (writing uses the textarea) */
document.addEventListener("keydown",e=>{
  if(KIND!=="prelims"||!$("submitBtn")||!$("opts"))return;
  const opts=[...document.querySelectorAll("#opts .opt")]; let target=null;
  if(/^[1-9]$/.test(e.key)) target=opts[+e.key-1];
  else if(/^[a-dA-D]$/.test(e.key)) target=opts.find(o=>o.dataset.l===e.key.toLowerCase());
  if(target){ target.click(); e.preventDefault(); return; }
  if(e.key==="Enter"){ $("submitBtn").click(); e.preventDefault(); }
  else if(e.key==="s"||e.key==="S"){ if($("skipBtn"))$("skipBtn").click(); }
});
</script>
