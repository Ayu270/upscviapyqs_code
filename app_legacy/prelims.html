<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC via PYQs — Prelims Autopsy Explorer</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>
<script src="store.js"></script>
<script src="msel.js"></script>
<link rel="stylesheet" href="msel.css">
<style>
:root{
  --navy:#16223E;--navy2:#1E3358;--gold:#D4A843;--gold-d:#B8922A;
  --cream:#FAF7F0;--bg:#F0E8D6;--card:#FFFFFF;--text:#1E1E2E;--muted:#7A7A8A;
  --border:#E5DECF;--green:#1A8040;--green-bg:#EAF7EE;--red:#AA3030;--red-bg:#FBEFEF;--radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold);gap:16px;flex-wrap:wrap}
.header h1{font-size:20px;font-weight:800}.header h1 span{color:var(--gold)}
.header .tag{font-size:11px;color:rgba(255,255,255,.6)}
.nav{display:flex;gap:6px}
.nav a{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);text-decoration:none;padding:6px 12px;border-radius:20px;border:1.5px solid transparent}
.nav a:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.nav a.active{color:var(--navy);background:var(--gold);border-color:var(--gold)}
.filters{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.filters select,.filters input{border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;background:var(--cream)}
.filters input{flex:1;min-width:180px}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--gold)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.wrap{max-width:900px;margin:0 auto;padding:20px 24px}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.card.open{border-color:var(--gold);box-shadow:0 4px 20px rgba(212,168,67,.12)}
.chead{padding:14px 16px;display:flex;gap:12px;cursor:pointer}
.cact{display:flex;flex-direction:column;gap:6px;align-items:center;margin-left:auto;flex-shrink:0}
.iconbtn{border:1.5px solid var(--border);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;line-height:1;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:.12s}
.iconbtn:hover{border-color:var(--gold);color:var(--gold-d)}
.iconbtn.on{background:#F7F0DC;border-color:var(--gold);color:var(--gold-d)}
.priorbadge{display:inline-block;font-size:10px;font-weight:700;border-radius:20px;padding:2px 9px;margin:8px 0 0 8px;text-transform:uppercase;letter-spacing:.5px}
.priorbadge.ok{background:var(--green-bg);color:var(--green)}.priorbadge.no{background:var(--red-bg);color:var(--red)}
.badge{min-width:48px;background:var(--navy);border-radius:8px;padding:6px;text-align:center;color:#fff;height:fit-content;flex-shrink:0}
.badge .y{color:var(--gold);font-weight:800;font-size:14px}.badge .q{font-size:10px;color:rgba(255,255,255,.6)}
.stem{font-size:14.5px;line-height:1.6;font-weight:500}
.stem p{margin:0 0 6px}
.chip{display:inline-block;font-size:10px;font-weight:700;color:var(--gold-d);background:#F7F0DC;border-radius:20px;padding:2px 10px;margin-top:8px;text-transform:uppercase;letter-spacing:.5px}
.body{display:none;padding:0 16px 16px 16px}
.card.open .body{display:block}
.opts{display:flex;flex-direction:column;gap:7px;margin:6px 0 12px}
.opt{display:flex;gap:10px;padding:9px 13px;border:1.5px solid var(--border);border-radius:8px;background:var(--cream);cursor:pointer;font-size:14px;line-height:1.5;transition:.12s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--navy);background:#F4F0E0}
.opt .l{font-weight:800;color:var(--navy)}
.opt.correct{border-color:var(--green);background:var(--green-bg)}.opt.correct .l{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}.opt.wrong .l{color:var(--red)}
.btn{padding:9px 18px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.verdict{display:inline-block;margin-left:10px;font-weight:700;font-size:13px;padding:6px 12px;border-radius:8px}
.verdict.ok{background:var(--green-bg);color:var(--green)}.verdict.no{background:var(--red-bg);color:var(--red)}
/* analysis: faithful render of the autopsy */
.analysis{font-size:14px;line-height:1.65;margin-top:14px}
.analysis p{margin:8px 0}
.analysis ul,.analysis ol{margin:8px 0 8px 22px}.analysis li{margin:4px 0}
.analysis h4.ah{font-size:14.5px;color:var(--navy);font-weight:800;margin:18px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--border)}
.analysis hr{border:none;border-top:1px dashed var(--border);margin:14px 0}
.analysis blockquote{border-left:3px solid var(--gold);background:#FBF8F0;margin:10px 0;padding:6px 14px;color:var(--text)}
.analysis table,.stem table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px;display:block;overflow-x:auto}
.analysis th,.analysis td,.stem th,.stem td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
.analysis th,.stem th{background:#F7F0DC;font-weight:700}
.stem ul,.stem ol{margin:8px 0 8px 22px}.stem li{margin:3px 0}
/* keep wide math (flow diagrams) and wide tables inside the card — scroll, don't overflow the page */
.katex-display{margin:10px 0!important;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 2px}
.analysis,.stem{overflow-x:auto}
body{overflow-x:hidden}
.analysis code{background:#F0ECE0;padding:1px 5px;border-radius:4px;font-size:12.5px}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;padding:16px}
.pager button{padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-weight:600}
.pager button:disabled{opacity:.4;cursor:default}
.loading{text-align:center;padding:60px;color:var(--muted)}
mark{background:#FCE9A6;color:inherit;padding:0 1px;border-radius:2px}
.related{margin-top:16px;border-top:1px dashed var(--border);padding-top:10px}
.related .rh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.related a{display:block;font-size:13px;color:var(--navy2);text-decoration:none;padding:4px 0;cursor:pointer}
.related a:hover{color:var(--gold-d)}
@media(max-width:560px){
  .header{padding:12px 14px}.wrap{padding:14px}
  .filters{padding:10px 14px;gap:8px}.filters input,.filters select{font-size:12.5px;padding:7px 10px}
  .chead{padding:12px;gap:10px}.stem{font-size:14px}.opt{padding:10px 12px}
}
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="header">
  <div><a href="index.html" class="brand"><h1>UPSC via <span>PYQs</span></h1></a><div class="tag">Prelims Autopsy Explorer · 2013–2026</div></div>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="prelims.html" class="active">Prelims</a>
    <a href="mains.html">Mains</a>
    <a href="optional.html">Optional</a>
    <a href="frameworks.html">Frameworks</a>
    <a href="practice.html">Practice</a>
    <a href="dashboard.html">Dashboard</a>
  </div>
  <div class="tag" id="hcount"></div>
</div>
<div class="filters">
  <input id="q" placeholder="Search questions…">
  <div id="subject"></div>
  <div id="year"></div>
  <div id="show"></div>
  <select id="sort"><option value="year">Newest first</option><option value="yearA">Oldest first</option></select>
  <span class="count" id="count"></span>
</div>
<div class="wrap"><div class="pager" id="pagertop"></div><div id="list" class="loading">Loading questions…</div><div class="pager" id="pager"></div></div>

<script>
let DATA=[], view=[], page=0, PER=12;
const $=id=>document.getElementById(id);
const strip=h=>(h||"").replace(/<[^>]+>/g," ");
function hl(html){ const t=$("q").value.trim(); if(t.length<2)return html;
  const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  return html.split(/(<[^>]+>)/).map(s=>s.charAt(0)==="<"?s:s.replace(re,"<mark>$1</mark>")).join(""); }
function renderMath(html){
  if(!window.katex||!html||html.indexOf("\\")<0)return html||"";
  return html
    .replace(/\\\[([\s\S]+?)\\\]/g,(m,e)=>{try{return katex.renderToString(e,{displayMode:true,throwOnError:false})}catch(_){return m}})
    .replace(/\\\(([\s\S]+?)\\\)/g,(m,e)=>{try{return katex.renderToString(e,{displayMode:false,throwOnError:false})}catch(_){return m}});
}

fetch("../data/prelims_structured.json").then(r=>r.json()).then(d=>{
  DATA=d;
  $("hcount").textContent=d.length.toLocaleString()+" questions";
  MSel.create("subject",{key:"subject",label:"Subject"});
  MSel.create("year",{key:"year",label:"Year"});
  MSel.create("show",{key:"show",label:"Show"});
  MSel.setOptions("show",[{v:"book",l:"★ Bookmarked"},{v:"rev",l:"⚑ For revision"},{v:"wrong",l:"✗ Got wrong"},{v:"unatt",l:"Unattempted"}]);
  MSel.onChange(()=>{page=0;refreshFacets();apply();});
  $("q").addEventListener("input",()=>{page=0;apply()});
  $("sort").addEventListener("input",()=>{page=0;apply()});
  // deep-link / shareable filters: ?q=&subject=&year=&show=&sort=  (comma-separated for multi)
  const P=new URLSearchParams(location.search);
  ["subject","year","show"].forEach(k=>{const v=P.get(k);if(v)MSel.set(k,v.split(","));});
  if(P.get("q"))$("q").value=P.get("q");
  if(P.get("sort"))$("sort").value=P.get("sort");
  // keyboard paging (when not typing in a field)
  document.addEventListener("keydown",e=>{
    const tag=(document.activeElement&&document.activeElement.tagName)||"";
    if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA")return;
    const pages=Math.ceil(view.length/PER);
    if(e.key==="ArrowLeft"&&page>0)go(-1);
    else if(e.key==="ArrowRight"&&page<pages-1)go(1);
  });
  refreshFacets(); apply();
}).catch(e=>{console.error("load/render error:",e);if(!DATA.length)$("list").innerHTML='<div class="loading">Could not load data. Serve from the project root:<br><br><code>cd upscviapyqs &amp;&amp; python3 -m http.server 8000</code><br>then open <code>http://localhost:8000/app/</code></div>';});

const uniq=a=>[...new Set(a)];
function facetOK(x,exc){
  const S=MSel.values("subject"),Y=MSel.values("year");
  if(exc!=="subject"&&S.length&&!S.includes(x.subject))return false;
  if(exc!=="year"&&Y.length&&!Y.includes(String(x.year)))return false;
  return true;
}
function showOK(x){
  const S=MSel.values("show"); if(!S.length)return true;
  return S.some(s=>{
    if(s==="book")return Store.isBookmarked("prelims",x.id);
    if(s==="rev")return Store.isRevise("prelims",x.id);
    if(s==="wrong"){const a=Store.attempt(x.id);return a&&!a.correct;}
    if(s==="unatt")return !Store.attempt(x.id);
    return false;
  });
}
function refreshFacets(){
  MSel.setOptions("subject",uniq(DATA.filter(x=>facetOK(x,"subject")).map(x=>x.subject)).filter(Boolean).sort());
  MSel.setOptions("year",uniq(DATA.filter(x=>facetOK(x,"year")).map(x=>String(x.year)).filter(Boolean)).sort((a,b)=>b-a));
}
function apply(){
  const q=$("q").value.toLowerCase(),sort=$("sort").value;
  view=DATA.filter(x=>facetOK(x)&&showOK(x)&&(!q||strip(x.stem_html).toLowerCase().includes(q)));
  view.sort((a,b)=>sort==="yearA"?a.year-b.year||a.q_number-b.q_number:b.year-a.year||a.q_number-b.q_number);
  $("count").textContent=view.length.toLocaleString()+" results";
  render();
}
function render(){
  const start=page*PER,items=view.slice(start,start+PER);
  const pages=Math.ceil(view.length/PER);
  $("list").className="";
  $("list").innerHTML=items.length?items.map(card).join(""):'<div class="loading">No matches.</div>';
  // build the pager FIRST so nothing downstream can prevent it
  const pg=pages>1?`<button ${page<=0?'disabled':''} onclick="go(-1)">← Prev</button><span>Page ${page+1} / ${pages}</span><button ${page>=pages-1?'disabled':''} onclick="go(1)">Next →</button>`:"";
  $("pager").innerHTML=pg; $("pagertop").innerHTML=pg;
  items.forEach(x=>{try{wire(x);}catch(e){console.warn("wire skipped:",x.id,e);}});
  window.scrollTo({top:0,behavior:"smooth"});
}
window.go=d=>{page+=d;render()};

function card(x){
  const opts=(x.options||[]).map(o=>`<label class="opt" data-l="${o.letter}"><span class="l">(${o.letter})</span><span>${o.html}</span></label>`).join("");
  const a=Store.attempt(x.id);
  const prior=a?`<span class="priorbadge ${a.correct?'ok':'no'}">${a.correct?'✓ solved':'✗ missed'}</span>`:"";
  const bk=Store.isBookmarked("prelims",x.id), rv=Store.isRevise("prelims",x.id);
  return `<div class="card" id="c-${x.id}">
    <div class="chead" onclick="toggle('${x.id}')">
      <div class="badge"><div class="y">${x.year}</div><div class="q">Q${x.q_number||''}</div></div>
      <div style="flex:1;min-width:0"><div class="stem">${hl(renderMath(x.stem_html))}</div>${x.subject?`<span class="chip">${x.subject}</span>`:""}${prior}</div>
      <div class="cact">
        <button class="iconbtn ${bk?'on':''}" title="Bookmark" onclick="event.stopPropagation();tBook('${x.id}',this)">★</button>
        <button class="iconbtn ${rv?'on':''}" title="Mark for revision" onclick="event.stopPropagation();tRev('${x.id}',this)">⚑</button>
      </div>
    </div>
    <div class="body">
      <div class="opts">${opts}</div>
      <button class="btn" id="b-${x.id}">Check answer</button><span id="v-${x.id}"></span>
      <div id="reveal-${x.id}" style="display:none"><div class="analysis">${renderMath(x.analysis_html)}</div>${relatedBlock(x)}</div>
    </div></div>`;
}
function relatedBlock(x){
  if(!x.subject)return "";
  const rel=DATA.filter(d=>d.subject===x.subject&&d.id!==x.id).slice(0,4);
  if(!rel.length)return "";
  return `<div class="related"><div class="rh">More from ${x.subject}</div>`+
    rel.map(r=>`<a onclick="jumpTo('${r.id}')">${strip(r.stem_html).slice(0,90)}…</a>`).join("")+`</div>`;
}
function wire(x){
  const card=$("c-"+x.id);if(!card)return;let chosen=null;
  card.querySelectorAll(".opt").forEach(o=>o.addEventListener("click",()=>{
    if(card.dataset.done)return;
    card.querySelectorAll(".opt").forEach(z=>z.classList.remove("sel"));
    o.classList.add("sel");chosen=o.dataset.l;
  }));
  $("b-"+x.id).addEventListener("click",()=>{
    if(card.dataset.done)return;
    if(!chosen){$("v-"+x.id).innerHTML='<span class="verdict no">Pick an option first</span>';return;}
    card.dataset.done=1;
    const correct=(x.correct_answer||"").toLowerCase();
    card.querySelectorAll(".opt").forEach(z=>{
      if(z.dataset.l===correct)z.classList.add("correct");
      else if(z.dataset.l===chosen)z.classList.add("wrong");
    });
    const ok=chosen===correct;
    Store.recordAttempt(x.id,chosen,ok);
    $("v-"+x.id).innerHTML=`<span class="verdict ${ok?'ok':'no'}">${ok?'✓ Correct':'✗ Incorrect — answer is ('+correct+')'}</span>`;
    $("b-"+x.id).disabled=true;
    $("reveal-"+x.id).style.display="block";
  });
}
window.toggle=id=>$("c-"+id).classList.toggle("open");
window.jumpTo=id=>{
  const x=DATA.find(d=>d.id===id); if(!x)return;
  $("q").value=""; MSel.set("subject",x.subject?[x.subject]:[]); MSel.set("year",[]); MSel.set("show",[]);
  page=0; refreshFacets(); apply();
  const i=view.findIndex(d=>d.id===id); if(i>=0){page=Math.floor(i/PER);render();}
  setTimeout(()=>{const c=$("c-"+id);if(c){c.classList.add("open");c.scrollIntoView({behavior:"smooth",block:"center"});}},80);
};
window.tBook=(id,btn)=>{const on=Store.toggleBookmark("prelims",id);btn.classList.toggle("on",on);if(MSel.values("show").length)apply();};
window.tRev=(id,btn)=>{const on=Store.toggleRevise("prelims",id);btn.classList.toggle("on",on);if(MSel.values("show").length)apply();};
</script>
</body>
</html>
